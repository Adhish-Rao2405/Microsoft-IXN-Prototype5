name: Prototype 5 qualification

"on":
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype5-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype5-tests:
    name: Prototype 5 tests (Windows, Python 3.12.10)
    runs-on: windows-latest
    timeout-minutes: 15

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-win-py312.lock

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install repository dependencies
        run: python -m pip install --require-hashes -r requirements-win-py312.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify dependency environment
        run: |
          python --version
          python -m pip --version
          python -m pip check
          python -m pip freeze --all
          node --version
          npm --version

      - name: Qualify integrated demo frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run test:e2e

      - name: Run Prototype 5 tests
        run: python -m pytest tests/prototype5 -q

      - name: Verify repository cleanliness
        shell: pwsh
        run: |
          git diff --check
          git diff --exit-code

          $changes = git status --porcelain
          if ($changes) {
            $changes
            throw "Prototype 5 tests modified or created repository files."
          }
