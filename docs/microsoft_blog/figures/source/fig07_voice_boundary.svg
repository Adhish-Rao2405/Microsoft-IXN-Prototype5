<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2654" viewBox="0 0 780 1150" role="img" aria-labelledby="title desc">
<title id="title">Reviewed voice shares the typed-input path</title><desc id="desc">Audio is transcribed into an untrusted raw transcript. Explicit operator review precedes a reviewed command. Reviewed and typed commands converge on a common command path and the same deterministic governance. Input modality grants no authority. Architecture shown; no speech-accuracy claim.</desc>
