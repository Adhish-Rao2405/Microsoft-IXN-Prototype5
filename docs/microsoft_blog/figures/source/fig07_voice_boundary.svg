<rect x="250" y="645" width="480" height="90" rx="8" fill="white" stroke="#8A8886" stroke-width="2"/>
<text x="490" y="700.0" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="600" fill="#242424" text-anchor="middle">Reviewed command</text>
<rect x="40" y="645" width="175" height="90" rx="8" fill="white" stroke="#8A8886" stroke-width="2"/>
<text x="127" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#242424" text-anchor="middle">Typed</text>
<text x="127" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#242424" text-anchor="middle">input</text>
