<text x="40" y="62.0" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#242424" text-anchor="start">Reviewed voice shares</text>
<text x="40" y="117.44" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#242424" text-anchor="start">the typed-input path</text>
<rect x="250" y="153" width="480" height="82" rx="8" fill="white" stroke="#8A8886" stroke-width="2"/>
<text x="490" y="205.0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#242424" text-anchor="middle">Audio</text>
<path id="audio-to-transcription" d="M490 235 V273" fill="none" stroke="#605E5C" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="250" y="283" width="480" height="134" rx="8" fill="white" stroke="#8A8886" stroke-width="2"/>
<text x="490" y="326.0" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="600" fill="#242424" text-anchor="middle">Local transcription</text>
<text x="490" y="369.0" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#242424" text-anchor="middle">RAW TRANSCRIPT</text>
<text x="490" y="402.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#242424" text-anchor="middle">UNTRUSTED</text>
<path id="raw-to-review" d="M490 417 V486" fill="none" stroke="#605E5C" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="250" y1="453" x2="470" y2="453" stroke="#8A6D00" stroke-width="2" stroke-dasharray="10 7"/>
<line x1="510" y1="453" x2="730" y2="453" stroke="#8A6D00" stroke-width="2" stroke-dasharray="10 7"/>
<rect x="250" y="496" width="480" height="90" rx="8" fill="white" stroke="#8A6D00" stroke-width="2"/>
<text x="490" y="550.0" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="600" fill="#242424" text-anchor="middle">Explicit operator review</text>
