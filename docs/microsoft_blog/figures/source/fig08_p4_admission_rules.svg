<title id="title">What stricter admission rules revealed</title><desc id="desc">P4, the same 120 retained records reclassified under four admission rules. Schema: 90 accepted, 14 previously successful records retained, 76 false-accept classifications. Plus exact-score semantics: 18, 14, 4. Plus uncertainty: 14, 14, 0. Full retained policy: 14, 14, 0. This is dependent retrospective reclassification, not a causal ablation or evidence of zero future risk.</desc>
