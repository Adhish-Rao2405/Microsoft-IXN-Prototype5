<text x="65" y="1346.0" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#242424" text-anchor="start">Frozen qualification evidence</text>
<text x="65" y="1387.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#242424" text-anchor="start">Independent historical provenance.</text>
<text x="65" y="1423.96" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#242424" text-anchor="start">Not generated from the fresh proposal.</text>
<text x="65" y="1471.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#242424" text-anchor="start">B3.2: FAIL · 118 findings · zero physics steps</text>
