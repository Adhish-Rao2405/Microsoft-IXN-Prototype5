<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="4015" viewBox="0 0 780 1740" role="img" aria-labelledby="title desc">
<title id="title">Proposal, governance and qualification</title><desc id="desc">Typed or operator-reviewed input enters selected probabilistic inference, producing an untrusted proposal. An authority boundary precedes project-owned deterministic governance: whole-response parsing, schema, semantics, ambiguity and policy. Only ACCEPT leads to execution eligibility and a separately bounded qualification step. CLARIFY or REJECT leads to no progression. Independently sourced frozen qualification evidence is not derived from the fresh proposal. Physical execution authority is NOT_IMPLEMENTED.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#605E5C"/></marker></defs>
