<text x="390" y="376.0" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#242424" text-anchor="middle">UNTRUSTED PROPOSAL</text>
<text x="390" y="417.0" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" fill="#242424" text-anchor="middle">No authority</text>
<path id="proposal-to-governance" d="M390 442 V515" fill="none" stroke="#605E5C" stroke-width="2.5" marker-end="url(#arrow)"/>
