<text x="65" y="565.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#242424" text-anchor="start">PROJECT-OWNED</text>
<text x="65" y="609.0" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="600" fill="#242424" text-anchor="start">Deterministic governance</text>
<text x="65" y="649.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#242424" text-anchor="start">Parse · schema · semantics</text>
<text x="65" y="681.0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#242424" text-anchor="start">Ambiguity · project-defined policy</text>
