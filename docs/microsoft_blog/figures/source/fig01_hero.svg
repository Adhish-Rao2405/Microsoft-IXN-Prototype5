<text x="390" y="370.0" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" fill="#242424" text-anchor="middle">AUTHORITY</text>
<text x="390" y="440.0" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="400" fill="#242424" text-anchor="middle">Project-owned deterministic governance</text>
