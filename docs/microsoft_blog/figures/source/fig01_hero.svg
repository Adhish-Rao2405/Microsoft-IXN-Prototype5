<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1338" viewBox="0 0 780 580" role="img" aria-labelledby="title desc">
<title id="title">Model proposal is not authority</title><desc id="desc">Model proposal is not equal to authority. Project-owned deterministic governance controls progression. Physical execution authority is NOT_IMPLEMENTED.</desc>
