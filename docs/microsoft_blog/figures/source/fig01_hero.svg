<text x="390" y="172.0" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" fill="#242424" text-anchor="middle">MODEL PROPOSAL</text>
<line x1="70" y1="253" x2="290" y2="253" stroke="#8A6D00" stroke-width="2" stroke-dasharray="10 7"/>
<line x1="490" y1="253" x2="710" y2="253" stroke="#8A6D00" stroke-width="2" stroke-dasharray="10 7"/>
